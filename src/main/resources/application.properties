# ==================================================================
# HFF DATA STUDIO - APPLICATION CONFIGURATION
# ==================================================================
spring.application.name=hff-data-studio
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.profiles.active=dev

# ==================================================================
# DATABASE
# ==================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hff_data_studio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=HffHikariPool

# ==================================================================
# JPA / HIBERNATE
# ==================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.open-in-view=false

# ==================================================================
# FLYWAY (MIGRATIONS)
# ==================================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ==================================================================
# FILE UPLOAD
# ==================================================================
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.max-size=${FILE_MAX_SIZE_MB:200}
file.allowed-extensions=csv,xlsx,xls,sql,json,txt
file.storage-type=${FILE_STORAGE_TYPE:local}
file.s3.bucket=${S3_BUCKET:}
file.s3.region=${S3_REGION:us-east-1}
file.encryption-enabled=${FILE_ENCRYPTION_ENABLED:false}

# ==================================================================
# EXPORTS
# ==================================================================
export.storage-dir=${EXPORT_STORAGE_DIR:./exports}
export.cleanup-cron=0 0 2 * * ?
export.retention-days=${EXPORT_RETENTION_DAYS:90}

# ==================================================================
# JWT / AUTHENTICATION
# ==================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:hff-data-studio}
jwt.audience=${JWT_AUDIENCE:hff-api}

auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.lockout-duration-minutes=${AUTH_LOCKOUT_MINUTES:15}
auth.password-min-length=12
auth.password-require-uppercase=true
auth.password-require-lowercase=true
auth.password-require-digit=true
auth.password-require-special=true
auth.mfa.enabled=${AUTH_MFA_ENABLED:false}
auth.mfa.issuer=HFF Data Studio

# ==================================================================
# SECURITY HEADERS
# ==================================================================
security.headers.frame-options=DENY
security.headers.xss-protection=1; mode=block
security.headers.content-type-options=nosniff
security.headers.hsts-enabled=${SECURITY_HSTS_ENABLED:true}
security.headers.hsts-max-age=31536000
security.headers.hsts-include-subdomains=true
security.headers.referrer-policy=strict-origin-when-cross-origin
security.headers.permissions-policy=geolocation=(), microphone=(), camera=()
security.headers.content-security-policy=default-src 'self'; frame-ancestors 'none'

# ==================================================================
# CORS
# ==================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,X-Tenant-Id
cors.exposed-headers=Authorization,Content-Disposition,X-Total-Count
cors.allow-credentials=true
cors.max-age=3600

# ==================================================================
# SESSION
# ==================================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ==================================================================
# PASSWORD ENCODING
# ==================================================================
security.password-encoder.strength=12

# ==================================================================
# ENCRYPTION (AES-256 pour credentials & données sensibles)
# ==================================================================
security.encryption.key=${ENCRYPTION_KEY:hff-default-encryption-key-32ch}
security.encryption.algorithm=AES
security.encryption.transformation=AES/GCM/NoPadding

# ==================================================================
# RATE LIMITING
# ==================================================================
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.default.limit=${RATE_LIMIT_DEFAULT:100}
rate-limit.default.duration=60
rate-limit.auth.limit=${RATE_LIMIT_AUTH:10}
rate-limit.auth.duration=60
rate-limit.analyses.limit=50
rate-limit.exports.limit=20
rate-limit.uploads.limit=30

# ==================================================================
# REDIS (Cache + Blacklist JWT)
# ==================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
cache.type=redis
cache.ttl.permissions=3600
cache.ttl.statistics=300
cache.ttl.datasets=600
cache.ttl.user-sessions=1800

# ==================================================================
# SPRING CACHE
# ==================================================================
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.cache-names=permissions,statistics,datasets,userProfiles

# ==================================================================
# EMAIL (Notifications)
# ==================================================================
spring.mail.host=${MAIL_HOST:smtp.hff.re}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@hff.re}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
notification.email.from=${MAIL_FROM:noreply@hff.re}
notification.email.enabled=${EMAIL_ENABLED:true}

# ==================================================================
# AI ASSISTANT (OpenAI / Compatible)
# ==================================================================
ai.enabled=${AI_ENABLED:false}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.url=${OPENAI_URL:https://api.openai.com/v1/chat/completions}
ai.openai.timeout=30000
ai.openai.max-tokens=1500
ai.openai.temperature=0.3
ai.rate-limit.per-user-per-day=${AI_RATE_LIMIT_PER_DAY:50}

# ==================================================================
# PYTHON ANALYSIS SERVICE
# ==================================================================
python.service.url=${PYTHON_SERVICE_URL:http://localhost:5000}
python.service.timeout=300000
python.service.connect-timeout=5000
python.service.read-timeout=300000
python.service.max-retries=3
python.service.retry-backoff=2000
resilience4j.circuitbreaker.instances.pythonService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pythonService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.pythonService.sliding-window-size=10
resilience4j.retry.instances.pythonService.max-attempts=3
resilience4j.retry.instances.pythonService.wait-duration=2s
resilience4j.timelimiter.instances.pythonService.timeout-duration=300s

# ==================================================================
# SCHEDULING
# ==================================================================
scheduling.enabled=${SCHEDULING_ENABLED:true}
scheduling.pool-size=${SCHEDULING_POOL_SIZE:5}
scheduling.analysis-check-interval=60000
scheduling.cleanup-cron=0 0 3 * * ?
scheduling.notification-cleanup-cron=0 0 4 * * ?
scheduling.token-cleanup-cron=0 0 5 * * ?
scheduling.activity-cleanup-cron=0 0 6 * * ?
scheduling.activity-retention-days=90
scheduling.notification-retention-days=30

# ==================================================================
# WEBHOOKS
# ==================================================================
webhook.enabled=${WEBHOOK_ENABLED:true}
webhook.timeout=10000
webhook.max-retries=3
webhook.retry-backoff=5000
webhook.max-failures-before-disable=10
webhook.signature-header=X-HFF-Signature
webhook.signature-algorithm=HmacSHA256

# ==================================================================
# EXTERNAL DATA SOURCES
# ==================================================================
datasource.connector.timeout=30000
datasource.connector.max-pool-size=5
datasource.connector.test-on-borrow=true
datasource.s3.enabled=${S3_ENABLED:false}
datasource.s3.region=${S3_REGION:us-east-1}
datasource.gcs.enabled=${GCS_ENABLED:false}
datasource.azure.enabled=${AZURE_ENABLED:false}

# ==================================================================
# MULTI-TENANCY
# ==================================================================
tenant.enabled=${TENANT_ENABLED:false}
tenant.header-name=X-Tenant-Id
tenant.domain-based=true
tenant.default-tenant=${DEFAULT_TENANT:default}
tenant.max-users-per-tenant=${TENANT_MAX_USERS:100}
tenant.max-storage-mb-per-tenant=${TENANT_MAX_STORAGE_MB:10240}

# ==================================================================
# FULL-TEXT SEARCH
# ==================================================================
search.enabled=${SEARCH_ENABLED:true}
search.default-limit=20
search.max-limit=100
search.min-query-length=2
search.rank-threshold=0.01
search.elasticsearch.enabled=${ES_ENABLED:false}
search.elasticsearch.url=${ES_URL:http://localhost:9200}

# ==================================================================
# OBSERVABILITY / ACTUATOR
# ==================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.mail.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}
management.tracing.sampling.probability=${TRACING_SAMPLE:0.1}
management.observations.key-values.application=${spring.application.name}

# ==================================================================
# LOGGING
# ==================================================================
logging.level.root=INFO
logging.level.com.henri_fraise.hff_data_studio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:./logs/hff-data-studio.log}
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=3GB
logging.logback.rollingpolicy.clean-history-on-start=false

# ==================================================================
# JACKSON
# ==================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# ==================================================================
# MULTIPART
# ==================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE_MB:200}MB
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE_MB:200}MB
spring.servlet.multipart.file-size-threshold=2MB

# ==================================================================
# ASYNC EXECUTION
# ==================================================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=200
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=hff-async-
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=hff-sched-

# ==================================================================
# ERROR HANDLING
# ==================================================================
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ==================================================================
# OPENAPI / SWAGGER
# ==================================================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=false

# ==================================================================
# APPLICATION SPECIFIC
# ==================================================================
app.data-initializer.enabled=${DATA_INIT_ENABLED:false}
app.admin.default-email=${ADMIN_EMAIL:admin@hff.re}
app.admin.default-password=${ADMIN_PASSWORD:}
app.admin.force-password-change=true
app.pagination.default-size=20
app.pagination.max-size=100

# ==================================================================
# MISC
# ==================================================================
spring.main.allow-circular-references=false
spring.main.banner-mode=console
spring.web.resources.add-mappings=false