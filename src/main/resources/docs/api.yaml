        - $ref: '#/components/parameters/CategoryIdPath'
      responses:
        '204':
          description: Supprimée

  /admin/categories/{categoryId}/permissions:
    get:
      tags: [Categories]
      summary: Permissions d'une catégorie
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    put:
      tags: [Categories]
      summary: Mettre à jour les permissions
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionUpdateRequest'
      responses:
        '200':
          description: Permissions mises à jour

  /admin/categories/permissions:
    get:
      tags: [Categories]
      summary: Toutes les permissions
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'

  # ═══════════════════════════════════════════════════════════════
  # AUDIT (ADMIN)
  # ═══════════════════════════════════════════════════════════════
  /admin/audit:
    get:
      tags: [Audit]
      summary: Logs d'audit
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          schema: { type: string, format: date-time }
        - name: action
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAuditLogResponse'

  /admin/audit/user/{userId}:
    get:
      tags: [Audit]
      summary: Logs d'un utilisateur
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAuditLogResponse'

  /admin/audit/{logId}:
    get:
      tags: [Audit]
      summary: Détails d'un log
      parameters:
        - name: logId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'

  /admin/audit/actions:
    get:
      tags: [Audit]
      summary: Actions distinctes
      responses:
        '200':
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /admin/audit/summary:
    get:
      tags: [Audit]
      summary: Résumé de l'audit
      responses:
        '200':
          description: Résumé
          content:
            application/json:
              schema:
                type: object

# ═══════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20 }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DatasetIdPath:
      name: datasetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ColumnIdPath:
      name: columnId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HistoryIdPath:
      name: historyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalysisIdPath:
      name: analysisId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionIdPath:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResultIdPath:
      name: resultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportIdPath:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ═══════════════ ENUMS ═══════════════
    UserRole:
      type: string
      enum: [ADMIN, DATA_ANALYST, CONSULTANT, INVITE]
    ProjectStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ARCHIVED]
    FileType:
      type: string
      enum: [CSV, XLSX, EXCEL, PNG, SVG, PDF, HTML, ZIP, SQL, JSON]
    FileProcessingStatus:
      type: string
      enum: [RECEIVED, ANALYZING, EXPLORED, CLEANED, ERROR]
    ColumnType:
      type: string
      enum: [STRING, INTEGER, FLOAT, DATE, BOOLEAN]
    RuleType:
      type: string
      enum: [TYPE_CONVERSION, DUPLICATE_REMOVAL, NULL_IMPUTATION, REGEX_CLEANING, TRIM, VALUE_CONSTRAINT]
    CleaningHistoryStatus:
      type: string
      enum: [SUCCESS, FAILURE, PARTIAL_SUCCESS, IN_PROGRESS, CANCELLED, PENDING]
    AnalysisCategory:
      type: string
      enum: [STATISTICAL, CORRELATION, TEMPORAL, SEGMENTATION, FINANCIAL]
    AnalysisExecutionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ERROR, CANCELLED, PENDING]
    ResultType:
      type: string
      enum: [TABLE, CHART, KPI]
    ChartType:
      type: string
      enum: [BAR, LINE, PIE, SCATTER, AREA]
    ExportFormat:
      type: string
      enum: [CSV, XLSX, EXCEL, PNG, SVG, PDF, HTML, ZIP, SQL, JSON]
    EntityType:
      type: string
      enum: [USER, PROJECT, DATASET, FILE, ANALYSIS]
    MemberRole:
      type: string
      enum: [OWNER, EDITOR, VIEWER]
    NotificationType:
      type: string
      enum: [INFO, SUCCESS, WARNING, ERROR, MENTION]
    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, WEBHOOK]
    ScheduleFrequency:
      type: string
      enum: [ONCE, HOURLY, DAILY, WEEKLY, MONTHLY, CRON]
    WebhookProvider:
      type: string
      enum: [SLACK, TEAMS, DISCORD, GENERIC]
    DeliveryStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, RETRYING]
    DataSourceType:
      type: string
      enum: [POSTGRESQL, MYSQL, ORACLE, MARIADB, SQLSERVER, REST_API, S3, GCS, ONEDRIVE, SHAREPOINT]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    WidgetType:
      type: string
      enum: [KPI, CHART, TABLE, TEXT]
    AiRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM]
    TagColor:
      type: string
      enum: [BLUE, GREEN, YELLOW, RED, PURPLE, GRAY, ORANGE, TEAL]

    # ═══════════════ REQUESTS ═══════════════
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ProjectCreationRequest:
      type: object
      required: [projectName]
      properties:
        projectName: { type: string }
        description: { type: string }
        status:
          $ref: '#/components/schemas/ProjectStatus'

    ProjectUpdateRequest:
      type: object
      required: [projectName]
      properties:
        projectName: { type: string }
        description: { type: string }
        status:
          $ref: '#/components/schemas/ProjectStatus'

    DatasetColumnUpdateRequest:
      type: object
      properties:
        normalizedName: { type: string }
        targetType:
          $ref: '#/components/schemas/ColumnType'

    CleaningRuleRequest:
      type: object
      required: [ruleType]
      properties:
        ruleType:
          $ref: '#/components/schemas/RuleType'
        parametersJson:
          type: object
        executionOrder: { type: integer }
        isActive: { type: boolean, default: true }

    PredefinedAnalysisRequest:
      type: object
      required: [analysisName, category, referenceScript]
      properties:
        analysisName: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/AnalysisCategory'
        referenceScript: { type: string }
        requiredParametersJson:
          type: object

    AnalysisExecutionRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        parameters:
          type: object

    ExportRequest:
      type: object
      required: [executionId, exportFormat]
      properties:
        executionId: { type: string, format: uuid }
        exportFormat:
          $ref: '#/components/schemas/ExportFormat'
        resultIds:
          type: array
          items: { type: string, format: uuid }

    UserCreationRequest:
      type: object
      required: [lastName, firstName, email, password, role]
      properties:
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role:
          $ref: '#/components/schemas/UserRole'
        categoryId: { type: string, format: uuid }

    UserUpdateRequest:
      type: object
      properties:
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        role:
          $ref: '#/components/schemas/UserRole'
        categoryId: { type: string, format: uuid }
        newPassword: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password }

    CategoryCreationRequest:
      type: object
      required: [label, accessLevel]
      properties:
        label: { type: string }
        description: { type: string }
        accessLevel: { type: integer }

    PermissionUpdateRequest:
      type: object
      properties:
        permissionIds:
          type: array
          items: { type: string, format: uuid }

    ShareProjectRequest:
      type: object
      required: [projectId, role]
      properties:
        projectId: { type: string, format: uuid }
        userEmail: { type: string, format: email }
        userId: { type: string, format: uuid }
        role:
          $ref: '#/components/schemas/MemberRole'

    CommentRequest:
      type: object
      required: [content, entityType, entityId]
      properties:
        content: { type: string, maxLength: 5000 }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }

    FavoriteRequest:
      type: object
      required: [entityType, entityId]
      properties:
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        displayName: { type: string }

    ScheduledAnalysisRequest:
      type: object
      required: [name, datasetId, frequency]
      properties:
        name: { type: string }
        datasetId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        parameters:
          type: object
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        cronExpression: { type: string }
        isActive: { type: boolean }

    WebhookRequest:
      type: object
      required: [name, url, provider, eventTypes]
      properties:
        name: { type: string }
        url: { type: string }
        provider:
          $ref: '#/components/schemas/WebhookProvider'
        eventTypes:
          type: array
          items: { type: string }
        secret: { type: string }
        isActive: { type: boolean }

    ExternalDataSourceRequest:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string }
        type:
          $ref: '#/components/schemas/DataSourceType'
        config:
          type: object
        credentials:
          type: object

    DashboardRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        isDefault: { type: boolean }
        isPublic: { type: boolean }
        projectId: { type: string, format: uuid }
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetRequest'

    WidgetRequest:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: '#/components/schemas/WidgetType'
        title: { type: string }
        position: { type: integer }
        rowIndex: { type: integer }
        colIndex: { type: integer }
        width: { type: integer }
        height: { type: integer }
        config:
          type: object
        dataSourceType: { type: string }
        dataSourceId: { type: string, format: uuid }

    ApprovalRequestDto:
      type: object
      required: [entityType, entityId, title]
      properties:
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        title: { type: string }
        comment: { type: string }

    TagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color:
          $ref: '#/components/schemas/TagColor'

    TagAssignRequest:
      type: object
      required: [entityType, entityId, tagIds]
      properties:
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        tagIds:
          type: array
          items: { type: string, format: uuid }

    CatalogEntryRequest:
      type: object
      required: [entityType, entityId, displayName]
      properties:
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        displayName: { type: string }
        description: { type: string }
        businessDomain: { type: string }
        ownerName: { type: string }
        stewardName: { type: string }
        classification: { type: string }
        sensitivityLevel: { type: string }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object

    GlossaryTermRequest:
      type: object
      required: [term, definition]
      properties:
        term: { type: string }
        definition: { type: string }
        synonyms:
          type: array
          items: { type: string }
        relatedTerms:
          type: array
          items: { type: string }
        domain: { type: string }

    AiMessageRequest:
      type: object
      required: [message]
      properties:
        conversationId: { type: string, format: uuid }
        message: { type: string }
        contextType: { type: string }
        contextId: { type: string, format: uuid }

    TenantCreationRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        domain: { type: string }
        maxUsers: { type: integer }
        maxStorageMb: { type: integer, format: int64 }

    # ═══════════════ RESPONSES ═══════════════
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        tokenType: { type: string, default: Bearer }

    ProjectResponse:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/ProjectStatus'
        creatorUserId: { type: string, format: uuid }
        creatorFullName: { type: string }
        fileCount: { type: integer, format: int64 }
        datasetCount: { type: integer, format: int64 }

    ProjectStatisticsResponse:
      type: object
      properties:
        totalProjects: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        completed: { type: integer, format: int64 }
        archived: { type: integer, format: int64 }
        totalCreators: { type: integer, format: int64 }
        newProjectsLast30Days: { type: integer, format: int64 }

    ProjectMemberResponse:
      type: object
      properties:
        memberId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        userEmail: { type: string, format: email }
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt: { type: string, format: date-time }
        invitedByName: { type: string }

    ProjectTemplateResponse:
      type: object
      properties:
        templateId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        config:
          type: object
        isPublic: { type: boolean }
        usageCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    SourceFileResponse:
      type: object
      properties:
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        fileFormat:
          $ref: '#/components/schemas/FileType'
        storagePath: { type: string }
        sizesBytes: { type: integer, format: int64 }
        sizesFormatted: { type: string }
        uploadAt: { type: string, format: date-time }
        processingStatus:
          $ref: '#/components/schemas/FileProcessingStatus'
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        datasetCount: { type: integer }

    DatasetResponse:
      type: object
      properties:
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        rowCount: { type: integer }
        columnCount: { type: integer }
        createdAt: { type: string, format: date-time }
        isCleaned: { type: boolean }
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        qualityScore: { type: integer }
        analysisCount: { type: integer }

    DatasetColumnResponse:
      type: object
      properties:
        columnId: { type: string, format: uuid }
        originalName: { type: string }
        normalizedName: { type: string }
        detectedType:
          $ref: '#/components/schemas/ColumnType'
        targetType:
          $ref: '#/components/schemas/ColumnType'
        position: { type: integer }
        nullCount: { type: integer }
        nullPercentage: { type: number, format: double }
        uniqueCount: { type: integer }
        uniquePercentage: { type: number, format: double }
        cleaningRuleCount: { type: integer }
        datasetId: { type: string, format: uuid }

    DatasetStatisticsResponse:
      type: object
      properties:
        totalDatasets: { type: integer, format: int64 }
        totalRows: { type: integer, format: int64 }
        totalColumns: { type: integer, format: int64 }
        cleanedDatasets: { type: integer, format: int64 }
        uncleanedDatasets: { type: integer, format: int64 }
        averageQualityScore: { type: number, format: double }
        newDatasetsLast30Days: { type: integer, format: int64 }

    DatasetVersionResponse:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        datasetId: { type: string, format: uuid }
        versionNumber: { type: integer }
        label: { type: string }
        rowCount: { type: integer }
        columnCount: { type: integer }
        qualityScore: { type: number, format: double }
        isCurrent: { type: boolean }
        createdAt: { type: string, format: date-time }

    VersionDiffResponse:
      type: object
      properties:
        datasetId: { type: string, format: uuid }
        fromVersion: { type: integer }
        toVersion: { type: integer }
        rowCountDelta: { type: integer }
        columnCountDelta: { type: integer }
        qualityScoreDelta: { type: number, format: double }
        addedColumns:
          type: array
          items: { type: string }
        removedColumns:
          type: array
          items: { type: string }
        schemaChanged: { type: boolean }
        dataChanged: { type: boolean }

    ExplorationReportResponse:
      type: object
      properties:
        reportId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        totalRows: { type: integer }
        duplicateCount: { type: integer }
        missingValueCount: { type: integer }
        qualityScore: { type: number }
        reportPdfPath: { type: string }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        columnStatistics:
          type: object

    CleaningRuleResponse:
      type: object
      properties:
        ruleId: { type: string, format: uuid }
        ruleType:
          $ref: '#/components/schemas/RuleType'
        ruleTypeLabel: { type: string }
        parametersJson:
          type: object
        executionOrder: { type: integer }
        isActive: { type: boolean }
        columnId: { type: string, format: uuid }
        columnName: { type: string }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }

    CleaningHistoryResponse:
      type: object
      properties:
        historyId: { type: string, format: uuid }
        datasetId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        executedAt: { type: string, format: date-time }
        executedAtFormatted: { type: string }
        status:
          $ref: '#/components/schemas/CleaningHistoryStatus'
        statusLabel: { type: string }
        details: { type: string }
        durationMs: { type: integer }
        durationFormatted: { type: string }
        affectedRows: { type: integer }
        datasetName: { type: string }
        datasetRowCount: { type: integer }
        ruleType:
          $ref: '#/components/schemas/RuleType'
        ruleTypeLabel: { type: string }
        columnName: { type: string }
        ruleParameters: { type: string }
        userFullName: { type: string }
        userEmail: { type: string, format: email }

    DryRunResponse:
      type: object
      properties:
        datasetId: { type: string, format: uuid }
        totalRules: { type: integer }
        affectedRows: { type: integer }
        affectedColumns: { type: integer }
        estimatedDurationMs: { type: integer, format: int64 }
        previews:
          type: array
          items:
            type: object
        canProceed: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    CleaningSuggestionResponse:
      type: object
      properties:
        columnId: { type: string, format: uuid }
        columnName: { type: string }
        columnType: { type: string }
        suggestions:
          type: array
          items:
            type: object
            properties:
              ruleType: { type: string }
              priority: { type: integer }
              reason: { type: string }
              confidence: { type: number, format: double }
              parameters:
                type: object

    PredefinedAnalysisResponse:
      type: object
      properties:
        analysisId: { type: string, format: uuid }
        analysisName: { type: string }
        description: { type: string }
        category: { type: string }
        categoryLabel: { type: string }
        referenceScript: { type: string }
        requiredParametersJson:
          type: object
        executionCount: { type: integer, format: int64 }

    AnalysisExecutionResponse:
      type: object
      properties:
        executionId: { type: string, format: uuid }
        executedAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/AnalysisExecutionStatus'
        statusLabel: { type: string }
        durationMs: { type: integer }
