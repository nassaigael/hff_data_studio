openapi: 3.0.3
info:
  title: HFF Data Studio API
  description: >
    REST API for the HFF Data Studio platform — HFF Data Intelligence Platform.
    Enables import, exploration, cleaning, analysis, and export of datasets
    for the Data Analyst service of Henri Fraise Fils & Cie (HFF).
  version: "1.0.0"
  contact:
    name: Data Analyst Service — HFF
    email: data-analyst@hff.re
  license:
    name: HFF Internal Use — Restricted Distribution

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: Login, token refresh, logout
  - name: Users
    description: User account management (back-office)
  - name: Categories
    description: User categories and permission matrix
  - name: Projects
    description: Workspaces grouping files, datasets, and analyses
  - name: Files
    description: Import and management of source files (CSV, Excel, SQL)
  - name: Datasets
    description: Datasets extracted from source files
  - name: Exploration
    description: Data quality reporting
  - name: Cleaning
    description: Cleaning rules, type conversion, history
  - name: Analyses
    description: Predefined analysis catalog and executions
  - name: Exports
    description: Export results (CSV, Excel, images, ZIP)
  - name: Audit
    description: Traceability log of sensitive actions

security:
  - bearerAuth: []

paths:
  # ===================== AUTHENTICATION =====================
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: analyst@hff.re
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh an expired access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current user (invalidate token)
      responses:
        "204":
          description: Logout successful

  # ===================== USERS =====================
  /admin/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUser"
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreation"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already in use

  /admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get user details
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags: [Users]
      summary: Deactivate a user (soft delete)
      responses:
        "204":
          description: User deactivated

  # ===================== CATEGORIES / PERMISSIONS =====================
  /admin/categories:
    get:
      tags: [Categories]
      summary: List user categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCategory"
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCategory"

  /admin/permissions:
    get:
      tags: [Categories]
      summary: List available permissions
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /admin/categories/{categoryId}/permissions:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Categories]
      summary: Get permission matrix for a category
      responses:
        "200":
          description: Permissions granted to the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    put:
      tags: [Categories]
      summary: Update permission matrix for a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: Permission matrix updated

  # ===================== PROJECTS =====================
  /projects:
    get:
      tags: [Projects]
      summary: List projects accessible to current user
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProject"
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreation"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get project details
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreation"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Archive a project
      responses:
        "204":
          description: Project archived

  # ===================== FILES =====================
  /files/upload:
    post:
      tags: [Files]
      summary: Upload a source file (CSV, Excel, or SQL export)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, projectId]
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: integer
                  format: int64
                fileType:
                  $ref: "#/components/schemas/FileType"
      responses:
        "201":
          description: File received and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFile"
        "400":
          description: Invalid file format or size
        "413":
          description: File too large (> 200 MB default)

  /files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      summary: Get source file metadata
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFile"
    delete:
      tags: [Files]
      summary: Delete a source file and its associated datasets
      responses:
        "204":
          description: File deleted

  /files/{fileId}/datasets:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      summary: List datasets extracted from a file (Excel sheets / SQL tables)
      responses:
        "200":
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dataset"

  # ===================== DATASETS =====================
  /datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Datasets]
      summary: Get dataset details
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"

  /datasets/{datasetId}/data:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Datasets]
      summary: Get dataset data (paginated/filterable data viewer)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema:
            type: string
          description: Sort column (e.g., "price,desc")
        - name: filter
          in: query
          schema:
            type: string
          description: Multi-column filter (e.g., "status:eq:ACTIVE")
        - name: version
          in: query
          schema:
            type: string
            enum: [RAW, CLEANED]
            default: CLEANED
          description: Data version to display (before/after cleaning)
      responses:
        "200":
          description: Dataset data page
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: object
                  page:
                    type: integer
                  totalElements:
                    type: integer

  /datasets/{datasetId}/columns:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Datasets]
      summary: List dataset columns with their metadata
      responses:
        "200":
          description: List of columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetColumn"

  /datasets/{datasetId}/columns/{columnId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
      - name: columnId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Datasets]
      summary: Rename a column / adjust its target type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                normalizedName:
                  type: string
                targetType:
                  $ref: "#/components/schemas/ColumnType"
      responses:
        "200":
          description: Column updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetColumn"

  # ===================== EXPLORATION =====================
  /datasets/{datasetId}/exploration-report:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Exploration]
      summary: Get existing exploration report
      responses:
        "200":
          description: Exploration report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorationReport"
        "404":
          description: No report generated for this dataset
    post:
      tags: [Exploration]
      summary: Generate (or regenerate) dataset exploration report
      responses:
        "201":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorationReport"

  /datasets/{datasetId}/exploration-report/export:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Exploration]
      summary: Export exploration report as PDF or HTML
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [PDF, HTML]
            default: PDF
      responses:
        "200":
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string

  # ===================== CLEANING =====================
  /columns/{columnId}/rules:
    parameters:
      - name: columnId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Cleaning]
      summary: List cleaning rules for a column
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningRule"
    post:
      tags: [Cleaning]
      summary: Add a cleaning/conversion rule to a column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningRuleCreation"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningRule"

  /rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Cleaning]
      summary: Update a cleaning rule (parameters, order, active status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningRuleCreation"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningRule"
    delete:
      tags: [Cleaning]
      summary: Delete a cleaning rule
      responses:
        "204":
          description: Rule deleted

  /datasets/{datasetId}/cleaning/execute:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [Cleaning]
      summary: Execute the cleaning pipeline (all active rules, in order)
      responses:
        "202":
          description: Cleaning pipeline started (asynchronous processing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  processingId:
                    type: string
                  status:
                    type: string
                    example: IN_PROGRESS

  /datasets/{datasetId}/cleaning-history:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Cleaning]
      summary: Get cleaning operation history
      responses:
        "200":
          description: Cleaning history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningHistory"

  # ===================== ANALYSES =====================
  /analyses:
    get:
      tags: [Analyses]
      summary: List predefined analysis catalog
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/AnalysisCategory"
      responses:
        "200":
          description: Analysis catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredefinedAnalysis"
    post:
      tags: [Analyses]
      summary: Add a predefined analysis model to catalog (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredefinedAnalysis"
      responses:
        "201":
          description: Analysis model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredefinedAnalysis"

  /executions:
    post:
      tags: [Analyses]
      summary: Run an analysis execution (predefined or custom) on a dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisExecutionCreation"
      responses:
        "202":
          description: Execution started (asynchronous processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisExecution"
    get:
      tags: [Analyses]
      summary: List analysis executions
      parameters:
        - name: datasetId
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paginated list of executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAnalysisExecution"

  /executions/{executionId}:
    parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Analyses]
      summary: Get execution status and parameters
      responses:
        "200":
          description: Execution details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisExecution"

  /executions/{executionId}/results:
    parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Analyses]
      summary: Get results produced by an execution (tables, charts, KPIs)
      responses:
        "200":
          description: List of results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisResult"

  /analyses/models:
    post:
      tags: [Analyses]
      summary: Save a parameterized analysis configuration as a reusable model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                analysisId:
                  type: integer
                  format: int64
                parameters:
                  type: object
      responses:
        "201":
          description: Model saved

  # ===================== EXPORTS =====================
  /exports:
    post:
      tags: [Exports]
      summary: Export one or more results (CSV, Excel, image, or ZIP package)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreation"
      responses:
        "201":
          description: Export generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
    get:
      tags: [Exports]
      summary: List export history
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paginated export history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageExport"

  /exports/{exportId}/download:
    parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Exports]
      summary: Download exported file
      responses:
        "200":
          description: Exported file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ===================== AUDIT =====================
  /admin/audit:
    get:
      tags: [Audit]
      summary: Get global audit log (Admin)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  totalElements:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token validity duration (seconds)

    # ---------- Users ----------
    UserCategory:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
        label:
          type: string
          example: ADMIN
        description:
          type: string
        accessLevel:
          type: integer
          minimum: 1
          maximum: 5

    Permission:
      type: object
      properties:
        permissionId:
          type: integer
          format: int64
        code:
          type: string
          example: FILE_UPLOAD
        label:
          type: string
        module:
          type: string
          enum: [Import, Cleaning, Analysis, Export, Admin]

    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
          nullable: true
        category:
          $ref: "#/components/schemas/UserCategory"

    UserCreation:
      type: object
      required: [lastName, firstName, email, password, categoryId]
      properties:
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        categoryId:
          type: integer
          format: int64

    UserUpdate:
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
        active:
          type: boolean
        categoryId:
          type: integer
          format: int64

    PageUser:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        totalElements:
          type: integer

    # ---------- Projects ----------
    ProjectStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ARCHIVED]

    Project:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        projectName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ProjectStatus"
        creatorUserId:
          type: integer
          format: int64

    ProjectCreation:
      type: object
      required: [projectName]
      properties:
        projectName:
          type: string
        description:
          type: string

    PageProject:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          type: integer
        totalElements:
          type: integer

    # ---------- Files / Datasets ----------
    FileType:
      type: string
      enum: [CSV, EXCEL, SQL]

    FileProcessingStatus:
      type: string
      enum: [RECEIVED, ANALYZING, EXPLORED, CLEANED, ERROR]

    SourceFile:
      type: object
      properties:
        fileId:
          type: integer
          format: int64
        fileName:
          type: string
        fileType:
          $ref: "#/components/schemas/FileType"
        sizeBytes:
          type: integer
          format: int64
        uploadDate:
          type: string
          format: date-time
        processingStatus:
          $ref: "#/components/schemas/FileProcessingStatus"
        projectId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64

    Dataset:
      type: object
      properties:
        datasetId:
          type: integer
          format: int64
        datasetName:
          type: string
        rowCount:
          type: integer
        columnCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        isCleaned:
          type: boolean
        fileId:
          type: integer
          format: int64

    ColumnType:
      type: string
      enum: [STRING, INTEGER, FLOAT, DATE, BOOLEAN]

    DatasetColumn:
      type: object
      properties:
        columnId:
          type: integer
          format: int64
        originalName:
          type: string
        normalizedName:
          type: string
          nullable: true
        detectedType:
          $ref: "#/components/schemas/ColumnType"
        targetType:
          $ref: "#/components/schemas/ColumnType"
        position:
          type: integer
        nullCount:
          type: integer
        uniqueCount:
          type: integer
        datasetId:
          type: integer
          format: int64

    # ---------- Exploration ----------
    ExplorationReport:
      type: object
      properties:
        reportId:
          type: integer
          format: int64
        generationDate:
          type: string
          format: date-time
        totalRows:
          type: integer
        duplicateCount:
          type: integer
        missingValuesCount:
          type: integer
        qualityScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
        reportPdfPath:
          type: string
          nullable: true
        datasetId:
          type: integer
          format: int64

    # ---------- Cleaning ----------
    RuleType:
      type: string
      enum:
        - TYPE_CONVERSION
        - DUPLICATE_REMOVAL
        - NULL_IMPUTATION
        - REGEX_CLEANING
        - TRIM
        - VALUE_CONSTRAINT

    CleaningRule:
      type: object
      properties:
        ruleId:
          type: integer
          format: int64
        ruleType:
          $ref: "#/components/schemas/RuleType"
        parametersJson:
          type: object
        executionOrder:
          type: integer
        active:
          type: boolean
        columnId:
          type: integer
          format: int64

    CleaningRuleCreation:
      type: object
      required: [ruleType]
      properties:
        ruleType:
          $ref: "#/components/schemas/RuleType"
        parametersJson:
          type: object
        executionOrder:
          type: integer
        active:
          type: boolean
          default: true

    HistoryStatus:
      type: string
      enum: [SUCCESS, FAILURE]

    CleaningHistory:
      type: object
      properties:
        historyId:
          type: integer
          format: int64
        executionDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/HistoryStatus"
        details:
          type: string
          nullable: true
        datasetId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64

    # ---------- Analyses ----------
    AnalysisCategory:
      type: string
      enum: [STATISTICAL, CORRELATION, TEMPORAL, SEGMENTATION, FINANCIAL]

    PredefinedAnalysis:
      type: object
      properties:
        analysisId:
          type: integer
          format: int64
        analysisName:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/AnalysisCategory"
        referenceScript:
          type: string
        requiredParametersJson:
          type: object

    ExecutionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ERROR]

    AnalysisExecutionCreation:
      type: object
      required: [datasetId]
      properties:
        datasetId:
          type: integer
          format: int64
        analysisId:
          type: integer
          format: int64
          nullable: true
          description: NULL for custom analysis
        parameters:
          type: object

    AnalysisExecution:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        executionDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        durationMs:
          type: integer
          nullable: true
        usedParametersJson:
          type: object
        datasetId:
          type: integer
          format: int64
        analysisId:
          type: integer
          format: int64
          nullable: true
        userId:
          type: integer
          format: int64

    PageAnalysisExecution:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisExecution"
        page:
          type: integer
        totalElements:
          type: integer

    ResultType:
      type: string
      enum: [TABLE, CHART, KPI]

    AnalysisResult:
      type: object
      properties:
        resultId:
          type: integer
          format: int64
        resultType:
          $ref: "#/components/schemas/ResultType"
        title:
          type: string
        filePath:
          type: string
        fileFormat:
          type: string
          enum: [CSV, XLSX, PNG, SVG]
        displayOrder:
          type: integer
        executionId:
          type: integer
          format: int64
        chart:
          $ref: "#/components/schemas/Chart"
          nullable: true

    ChartType:
      type: string
      enum: [BAR, LINE, PIE, SCATTER, AREA]

    Chart:
      type: object
      properties:
        chartId:
          type: integer
          format: int64
        chartType:
          $ref: "#/components/schemas/ChartType"
        configJson:
          type: object
          description: >
            Visual configuration (colors, axes, legends) aligned with HFF
            brand guidelines (e.g., colors #0B2545, #FFCD11).
        resultId:
          type: integer
          format: int64

    # ---------- Exports ----------
    ExportFormat:
      type: string
      enum: [CSV, XLSX, PNG, ZIP]

    ExportCreation:
      type: object
      required: [executionId, exportFormat]
      properties:
        executionId:
          type: integer
          format: int64
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        resultIds:
          type: array
          items:
            type: integer
            format: int64

    Export:
      type: object
      properties:
        exportId:
          type: integer
          format: int64
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        exportDate:
          type: string
          format: date-time
        filePath:
          type: string
        executionId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64

    PageExport:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Export"
        page:
          type: integer
        totalElements:
          type: integer

    # ---------- Audit ----------
    AuditLog:
      type: object
      properties:
              logId:
                type: integer
                format: int64
              action:
                type: string
              concernedEntity:
                type: string
                nullable: true
              entityId:
                type: integer
                format: int64
                nullable: true
              actionDate:
                type: string
                format: date-time
              ipAddress:
                type: string
                nullable: true
              userId:
                type: integer
                format: int64