openapi: 3.0.3
info:
  title: HFF Data Studio API
  description: |
    **HFF Data Intelligence Platform** — From raw data to decision, without detour.
    
    API REST complète couvrant : authentification, gestion de projets, upload de fichiers,
    exploration, nettoyage, analyse, exports, collaboration, notifications, dashboards,
    webhooks, sources de données externes, recherche full-text, IA, multi-tenancy et administration.
  version: 1.0.0
  contact:
    name: Henri Fraise
    email: contact@hff.re
    url: https://hff.re
  license:
    name: Proprietary
    url: https://hff.re/license

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.hff.re/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Login, refresh token, logout
  - name: Health
    description: Statut du service et monitoring
  - name: Projects
    description: Gestion des projets
  - name: Files
    description: Upload et gestion des fichiers sources
  - name: Datasets
    description: Gestion des datasets et colonnes
  - name: Exploration
    description: Rapports d'exploration et qualité des données
  - name: Cleaning
    description: Règles de nettoyage et exécution
  - name: Analysis
    description: Analyses prédéfinies
  - name: Executions
    description: Exécutions d'analyses et résultats
  - name: Exports
    description: Export des résultats
  - name: Collaboration
    description: Partage de projets et membres
  - name: Comments
    description: Commentaires et annotations
  - name: Notifications
    description: Notifications in-app et email
  - name: Favorites
    description: Favoris et activité utilisateur
  - name: Scheduling
    description: Analyses planifiées
  - name: Webhooks
    description: Webhooks sortants
  - name: Data Sources
    description: Sources de données externes
  - name: Dashboards
    description: Dashboards personnalisables
  - name: Templates
    description: Templates de projets
  - name: Approvals
    description: Workflows d'approbation
  - name: Tags
    description: Tags polymorphes
  - name: Data Catalog
    description: Catalogue de données et glossaire
  - name: Search
    description: Recherche full-text
  - name: Versions
    description: Versioning de datasets
  - name: AI
    description: Assistant IA
  - name: Tenants
    description: Multi-tenancy
  - name: Users
    description: Gestion des utilisateurs (admin)
  - name: Categories
    description: Catégories et permissions (admin)
  - name: Permissions
    description: Permissions (admin)
  - name: Audit
    description: Logs d'audit (admin)

security:
  - bearerAuth: []

paths:

  # ═══════════════════════════════════════════════════════════════
  # AUTHENTICATION
  # ═══════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Authentication]
      summary: Connexion utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rafraîchir le token d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Déconnexion
      responses:
        '204':
          description: Déconnexion réussie

  # ═══════════════════════════════════════════════════════════════
  # HEALTH
  # ═══════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: État du service
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string }
                  version: { type: string }
                  timestamp: { type: integer, format: int64 }

  /health/info:
    get:
      tags: [Health]
      summary: Informations du service
      security: []
      responses:
        '200':
          description: Informations
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  description: { type: string }

  # ═══════════════════════════════════════════════════════════════
  # PROJECTS
  # ═══════════════════════════════════════════════════════════════
  /projects:
    get:
      tags: [Projects]
      summary: Liste des projets de l'utilisateur
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'
    post:
      tags: [Projects]
      summary: Créer un projet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreationRequest'
      responses:
        '201':
          description: Projet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/all:
    get:
      tags: [Projects]
      summary: Liste tous les projets (admin)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Détails d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Mettre à jour un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Projet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    delete:
      tags: [Projects]
      summary: Archiver un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204':
          description: Projet archivé

  /projects/{projectId}/restore:
    patch:
      tags: [Projects]
      summary: Restaurer un projet archivé
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Projet restauré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/{projectId}/status:
    patch:
      tags: [Projects]
      summary: Modifier le statut d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/{projectId}/hard:
    delete:
      tags: [Projects]
      summary: Suppression définitive (admin)
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204':
          description: Projet supprimé définitivement

  /projects/user/{userId}:
    get:
      tags: [Projects]
      summary: Projets d'un utilisateur
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/user/{userId}/status/{status}:
    get:
      tags: [Projects]
      summary: Projets d'un utilisateur par statut
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/search:
    get:
      tags: [Projects]
      summary: Rechercher des projets
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/status/{status}:
    get:
      tags: [Projects]
      summary: Projets par statut (admin)
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/statistics:
    get:
      tags: [Projects]
      summary: Statistiques globales (admin)
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatisticsResponse'

  # ═══════════════════════════════════════════════════════════════
  # FILES
  # ═══════════════════════════════════════════════════════════════
  /files/upload:
    post:
      tags: [Files]
      summary: Uploader un fichier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, projectId]
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
                  format: uuid
                fileType:
                  type: string
      responses:
        '201':
          description: Fichier uploadé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileResponse'

  /files/{fileId}:
    get:
      tags: [Files]
      summary: Détails d'un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Fichier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileResponse'
    delete:
      tags: [Files]
      summary: Supprimer un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '204':
          description: Fichier supprimé

  /files/{fileId}/download:
    get:
      tags: [Files]
      summary: Télécharger un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Contenu binaire
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/{fileId}/datasets:
    get:
      tags: [Files]
      summary: Datasets associés
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetResponse'

  /files/{fileId}/preview:
    get:
      tags: [Files]
      summary: Aperçu du contenu
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
        - name: maxLines
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Aperçu
          content:
            text/plain:
              schema: { type: string }

  /files/{fileId}/statistics:
    get:
      tags: [Files]
      summary: Statistiques d'un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object

  /files/{fileId}/status:
    patch:
      tags: [Files]
      summary: Mettre à jour le statut
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FileProcessingStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileResponse'

  /files/project/{projectId}:
    get:
      tags: [Files]
      summary: Fichiers d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceFileResponse'

  /files/project/{projectId}/page:
    get:
      tags: [Files]
      summary: Fichiers d'un projet (paginé)
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseSourceFileResponse'

  /files/status/{status}:
    get:
      tags: [Files]
      summary: Fichiers par statut
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FileProcessingStatus'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceFileResponse'

  /files/all:
    get:
      tags: [Files]
      summary: Tous les fichiers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseSourceFileResponse'

  # ═══════════════════════════════════════════════════════════════
  # DATASETS
  # ═══════════════════════════════════════════════════════════════
  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      summary: Détails d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
    delete:
      tags: [Datasets]
      summary: Supprimer un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '204':
          description: Dataset supprimé

  /datasets/{datasetId}/data:
    get:
      tags: [Datasets]
      summary: Données d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string, default: CLEANED }
      responses:
        '200':
          description: Données
          content:
            application/json:
              schema:
                type: object

  /datasets/{datasetId}/columns:
    get:
      tags: [Datasets]
      summary: Colonnes d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Colonnes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetColumnResponse'

  /datasets/{datasetId}/columns/{columnId}:
    get:
      tags: [Datasets]
      summary: Détails d'une colonne
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/ColumnIdPath'
      responses:
        '200':
          description: Colonne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnResponse'
    put:
      tags: [Datasets]
      summary: Mettre à jour une colonne
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/ColumnIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetColumnUpdateRequest'
      responses:
        '200':
          description: Colonne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnResponse'

  /datasets/{datasetId}/clean:
    patch:
      tags: [Datasets]
      summary: Marquer comme nettoyé
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Dataset mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'

  /datasets/{datasetId}/unclean:
    patch:
      tags: [Datasets]
      summary: Marquer comme non nettoyé
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Dataset mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'

  /datasets/{datasetId}/name:
    patch:
      tags: [Datasets]
      summary: Renommer un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - name: datasetName
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dataset renommé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'

  /datasets/{datasetId}/stats:
    patch:
      tags: [Datasets]
      summary: Mettre à jour les stats
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - name: rowCount
          in: query
          schema: { type: integer }
        - name: columnCount
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Dataset mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'

  /datasets/project/{projectId}:
    get:
      tags: [Datasets]
      summary: Datasets d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/file/{fileId}:
    get:
      tags: [Datasets]
      summary: Datasets d'un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/search:
    get:
      tags: [Datasets]
      summary: Rechercher des datasets
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/project/{projectId}/search:
    get:
      tags: [Datasets]
      summary: Rechercher dans un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: searchTerm
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/statistics:
    get:
      tags: [Datasets]
      summary: Statistiques globales
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetStatisticsResponse'

  /datasets/statistics/map:
    get:
      tags: [Datasets]
      summary: Statistiques (map)
      responses:
        '200':
          description: Map
          content:
            application/json:
              schema:
                type: object

  /datasets/cleaned:
    get:
      tags: [Datasets]
      summary: Datasets nettoyés
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/uncleaned:
    get:
      tags: [Datasets]
      summary: Datasets non nettoyés
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/recent:
    get:
      tags: [Datasets]
      summary: Datasets récents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetResponse'

  /datasets/project/{projectId}/recent:
    get:
      tags: [Datasets]
      summary: Datasets récents d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetResponse'

  # ═══════════════════════════════════════════════════════════════
  # DATASET VERSIONS
  # ═══════════════════════════════════════════════════════════════
  /datasets/{datasetId}/versions:
    post:
      tags: [Versions]
      summary: Créer une version
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - name: label
          in: query
          schema: { type: string }
      responses:
        '201':
          description: Version créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionResponse'
    get:
      tags: [Versions]
      summary: Lister les versions
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
