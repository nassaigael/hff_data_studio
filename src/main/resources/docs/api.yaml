openapi: 3.1.0
info:
  title: HFF Data Studio API
  description: HFF Data Intelligence Platform - CATalyst API
  version: 1.0.0
  contact:
    name: Data Analyst Service - HFF
    email: data-analyst@hff.re
  license:
    name: HFF Internal Use - Restricted Distribution

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://catalyst.hff.re/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Login, token refresh, logout
  - name: Users
    description: User account management
  - name: Categories
    description: User categories and permissions
  - name: Projects
    description: Project management
  - name: Files
    description: File upload and management
  - name: Datasets
    description: Dataset management
  - name: Exploration
    description: Data exploration and quality reports
  - name: Cleaning
    description: Data cleaning rules and execution
  - name: Analyses
    description: Predefined analyses and executions
  - name: Exports
    description: Export results
  - name: Audit
    description: Audit logs
  - name: Health
    description: Health check endpoints

paths:
  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current user
      operationId: logout
      responses:
        "204":
          description: Logout successful

  # ==================== USERS ====================
  /admin/users:
    get:
      tags: [Users]
      summary: Get all users
      operationId: getAllUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUserResponse"
    post:
      tags: [Users]
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreationRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /admin/users/active:
    get:
      tags: [Users]
      summary: Get active users
      operationId: getActiveUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of active users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUserResponse"

  /admin/users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags: [Users]
      summary: Update user
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags: [Users]
      summary: Deactivate user
      operationId: deactivateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deactivated

  /admin/users/{userId}/activate:
    patch:
      tags: [Users]
      summary: Activate user
      operationId: activateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /admin/users/{userId}/password:
    patch:
      tags: [Users]
      summary: Change user password
      operationId: changePassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed

  /admin/users/email/{email}:
    get:
      tags: [Users]
      summary: Get user by email
      operationId: getUserByEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /admin/users/category/{categoryId}:
    get:
      tags: [Users]
      summary: Get users by category
      operationId: getUsersByCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUserResponse"

  /admin/users/search:
    get:
      tags: [Users]
      summary: Search users
      operationId: searchUsers
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUserResponse"

  /admin/users/statistics:
    get:
      tags: [Users]
      summary: Get user statistics
      operationId: getUserStatistics
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatisticsResponse"

  /admin/users/statistics/yearly:
    get:
      tags: [Users]
      summary: Get users grouped by year
      operationId: getUsersByYear
      responses:
        "200":
          description: Yearly user statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array

  /admin/users/statistics/monthly:
    get:
      tags: [Users]
      summary: Get users grouped by month
      operationId: getUsersByMonth
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Monthly user statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array

  # ==================== CATEGORIES ====================
  /admin/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      operationId: getAllCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCategoryResponse"
    post:
      tags: [Categories]
      summary: Create category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreationRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCategoryResponse"

  /admin/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by ID
      operationId: getCategoryById
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCategoryResponse"
    put:
      tags: [Categories]
      summary: Update category
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreationRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCategoryResponse"
    delete:
      tags: [Categories]
      summary: Delete category
      operationId: deleteCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Category deleted

  /admin/categories/{categoryId}/permissions:
    get:
      tags: [Categories]
      summary: Get category permissions
      operationId: getCategoryPermissions
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionResponse"
    put:
      tags: [Categories]
      summary: Update category permissions
      operationId: updateCategoryPermissions
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionUpdateRequest"
      responses:
        "200":
          description: Permissions updated

  /admin/categories/permissions:
    get:
      tags: [Categories]
      summary: Get all permissions
      operationId: getAllPermissions
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionResponse"

  # ==================== PROJECTS ====================
  /projects:
    get:
      tags: [Projects]
      summary: Get all projects for current user
      operationId: getProjects
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreationRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

  /projects/all:
    get:
      tags: [Projects]
      summary: Get all projects (admin only)
      operationId: getAllProjectsAdmin
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project by ID
      operationId: getProjectById
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    put:
      tags: [Projects]
      summary: Update project
      operationId: updateProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    delete:
      tags: [Projects]
      summary: Archive project
      operationId: archiveProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Project archived

  /projects/{projectId}/restore:
    patch:
      tags: [Projects]
      summary: Restore archived project
      operationId: restoreProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

  /projects/{projectId}/status:
    patch:
      tags: [Projects]
      summary: Update project status
      operationId: updateProjectStatus
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: Project status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

  /projects/user/{userId}:
    get:
      tags: [Projects]
      summary: Get projects by user
      operationId: getProjectsByUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"

  /projects/user/{userId}/status/{status}:
    get:
      tags: [Projects]
      summary: Get projects by user and status
      operationId: getProjectsByUserAndStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"

  /projects/search:
    get:
      tags: [Projects]
      summary: Search projects
      operationId: searchProjects
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"

  /projects/status/{status}:
    get:
      tags: [Projects]
      summary: Get projects by status (admin only)
      operationId: getProjectsByStatus
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProjectResponse"

  /projects/statistics:
    get:
      tags: [Projects]
      summary: Get project statistics (admin only)
      operationId: getProjectStatistics
      responses:
        "200":
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatisticsResponse"

  /projects/{projectId}/hard:
    delete:
      tags: [Projects]
      summary: Hard delete project (admin only)
      operationId: hardDeleteProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Project permanently deleted

  # ==================== FILES ====================
  /files/upload:
    post:
      tags: [Files]
      summary: Upload a file
      operationId: uploadFile
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: fileType
          in: query
          schema:
            $ref: "#/components/schemas/FileType"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileResponse"

  /files/{fileId}:
    get:
      tags: [Files]
      summary: Get file by ID
      operationId: getFileById
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileResponse"
    delete:
      tags: [Files]
      summary: Delete file
      operationId: deleteFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: File deleted

  /files/project/{projectId}:
    get:
      tags: [Files]
      summary: Get files by project
      operationId: getFilesByProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceFileResponse"

  /files/project/{projectId}/page:
    get:
      tags: [Files]
      summary: Get files by project (paginated)
      operationId: getFilesByProjectPaged
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSourceFileResponse"

  /files/{fileId}/datasets:
    get:
      tags: [Files]
      summary: Get datasets by file
      operationId: getDatasetsByFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetResponse"

  /files/{fileId}/download:
    get:
      tags: [Files]
      summary: Download file
      operationId: downloadFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/{fileId}/preview:
    get:
      tags: [Files]
      summary: Get file preview
      operationId: getFilePreview
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: maxLines
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: File preview content
          content:
            text/plain:
              schema:
                type: string

  /files/{fileId}/statistics:
    get:
      tags: [Files]
      summary: Get file statistics
      operationId: getFileStatistics
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File statistics
          content:
            application/json:
              schema:
                type: object

  /files/status/{status}:
    get:
      tags: [Files]
      summary: Get files by status
      operationId: getFilesByStatus
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FileProcessingStatus"
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceFileResponse"

  /files/{fileId}/status:
    patch:
      tags: [Files]
      summary: Update file status
      operationId: updateFileStatus
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FileProcessingStatus"
      responses:
        "200":
          description: File status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileResponse"

  /files/all:
    get:
      tags: [Files]
      summary: Get all files (paginated)
      operationId: getAllFiles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSourceFileResponse"

  # ==================== DATASETS ====================
  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      summary: Get dataset by ID
      operationId: getDatasetById
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
    delete:
      tags: [Datasets]
      summary: Delete dataset
      operationId: deleteDataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Dataset deleted

  /datasets/{datasetId}/data:
    get:
