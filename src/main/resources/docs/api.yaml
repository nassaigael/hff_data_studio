components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20 }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DatasetIdPath:
      name: datasetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ColumnIdPath:
      name: columnId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HistoryIdPath:
      name: historyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalysisIdPath:
      name: analysisId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionIdPath:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResultIdPath:
      name: resultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportIdPath:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ---------- ENUMS ----------
    UserRole:
      type: string
      enum: [ADMIN, DATA_ANALYST, CONSULTANT, INVITE]
    ProjectStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ARCHIVED]
    FileType:
      type: string
      enum: [CSV, XLSX, EXCEL, PNG, SVG, PDF, HTML, ZIP, SQL, JSON]
    FileProcessingStatus:
      type: string
      enum: [RECEIVED, ANALYZING, EXPLORED, CLEANED, ERROR]
    ColumnType:
      type: string
      enum: [STRING, INTEGER, FLOAT, DATE, BOOLEAN]
    RuleType:
      type: string
      enum: [TYPE_CONVERSION, DUPLICATE_REMOVAL, NULL_IMPUTATION, REGEX_CLEANING, TRIM, VALUE_CONSTRAINT]
    CleaningHistoryStatus:
      type: string
      enum: [SUCCESS, FAILURE, PARTIAL_SUCCESS, IN_PROGRESS, CANCELLED, PENDING]
    AnalysisCategory:
      type: string
      enum: [STATISTICAL, CORRELATION, TEMPORAL, SEGMENTATION, FINANCIAL]
    AnalysisExecutionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ERROR, CANCELLED, PENDING]
    ResultType:
      type: string
      enum: [TABLE, CHART, KPI]
    ChartType:
      type: string
      enum: [BAR, LINE, PIE, SCATTER, AREA]
    ExportFormat:
      type: string
      enum: [CSV, XLSX, EXCEL, PNG, SVG, PDF, HTML, ZIP, SQL, JSON]
    EntityType:
      type: string
      enum: [USER, PROJECT, DATASET, FILE, ANALYSIS]

    # ---------- REQUESTS ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ProjectCreationRequest:
      type: object
      required: [projectName]
      properties:
        projectName: { type: string }
        description: { type: string }
        status:
          $ref: '#/components/schemas/ProjectStatus'

    ProjectUpdateRequest:
      type: object
      required: [projectName]
      properties:
        projectName: { type: string }
        description: { type: string }
        status:
          $ref: '#/components/schemas/ProjectStatus'

    DatasetColumnUpdateRequest:
      type: object
      properties:
        normalizedName: { type: string }
        targetType:
          $ref: '#/components/schemas/ColumnType'

    CleaningRuleRequest:
      type: object
      required: [ruleType]
      properties:
        ruleType:
          $ref: '#/components/schemas/RuleType'
        parametersJson:
          type: object
        executionOrder: { type: integer }
        isActive: { type: boolean, default: true }

    PredefinedAnalysisRequest:
      type: object
      required: [analysisName, category, referenceScript]
      properties:
        analysisName: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/AnalysisCategory'
        referenceScript: { type: string }
        requiredParametersJson:
          type: object

    AnalysisExecutionRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        parameters:
          type: object

    ExportRequest:
      type: object
      required: [executionId, exportFormat]
      properties:
        executionId: { type: string, format: uuid }
        exportFormat:
          $ref: '#/components/schemas/ExportFormat'
        resultIds:
          type: array
          items: { type: string, format: uuid }

    UserCreationRequest:
      type: object
      required: [lastName, firstName, email, password, role]
      properties:
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role:
          $ref: '#/components/schemas/UserRole'
        categoryId: { type: string, format: uuid }

    UserUpdateRequest:
      type: object
      properties:
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        role:
          $ref: '#/components/schemas/UserRole'
        categoryId: { type: string, format: uuid }
        newPassword: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password }

    CategoryCreationRequest:
      type: object
      required: [label, accessLevel]
      properties:
        label: { type: string }
        description: { type: string }
        accessLevel: { type: integer }

    PermissionUpdateRequest:
      type: object
      properties:
        permissionIds:
          type: array
          items: { type: string, format: uuid }

    # ---------- RESPONSES ----------
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        tokenType: { type: string, default: Bearer }

    ProjectResponse:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/ProjectStatus'
        creatorUserId: { type: string, format: uuid }
        creatorFullName: { type: string }
        fileCount: { type: integer, format: int64 }
        datasetCount: { type: integer, format: int64 }

    ProjectStatisticsResponse:
      type: object
      properties:
        totalProjects: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        completed: { type: integer, format: int64 }
        archived: { type: integer, format: int64 }
        totalCreators: { type: integer, format: int64 }
        newProjectsLast30Days: { type: integer, format: int64 }

    SourceFileResponse:
      type: object
      properties:
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        fileFormat:
          $ref: '#/components/schemas/FileType'
        storagePath: { type: string }
        sizesBytes: { type: integer, format: int64 }
        sizesFormatted: { type: string }
        uploadAt: { type: string, format: date-time }
        processingStatus:
          $ref: '#/components/schemas/FileProcessingStatus'
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        datasetCount: { type: integer }

    DatasetResponse:
      type: object
      properties:
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        rowCount: { type: integer }
        columnCount: { type: integer }
        createdAt: { type: string, format: date-time }
        isCleaned: { type: boolean }
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        qualityScore: { type: integer }
        analysisCount: { type: integer }

    DatasetColumnResponse:
      type: object
      properties:
        columnId: { type: string, format: uuid }
        originalName: { type: string }
        normalizedName: { type: string }
        detectedType:
          $ref: '#/components/schemas/ColumnType'
        targetType:
          $ref: '#/components/schemas/ColumnType'
        position: { type: integer }
        nullCount: { type: integer }
        nullPercentage: { type: number, format: double }
        uniqueCount: { type: integer }
        uniquePercentage: { type: number, format: double }
        cleaningRuleCount: { type: integer }
        datasetId: { type: string, format: uuid }

    DatasetStatisticsResponse:
      type: object
      properties:
        totalDatasets: { type: integer, format: int64 }
        totalRows: { type: integer, format: int64 }
        totalColumns: { type: integer, format: int64 }
        cleanedDatasets: { type: integer, format: int64 }
        uncleanedDatasets: { type: integer, format: int64 }
        averageQualityScore: { type: number, format: double }
        newDatasetsLast30Days: { type: integer, format: int64 }

    ExplorationReportResponse:
      type: object
      properties:
        reportId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        totalRows: { type: integer }
        duplicateCount: { type: integer }
        missingValueCount: { type: integer }
        qualityScore: { type: number }
        reportPdfPath: { type: string }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        columnStatistics:
          type: object

    CleaningRuleResponse:
      type: object
      properties:
        ruleId: { type: string, format: uuid }
        ruleType:
          $ref: '#/components/schemas/RuleType'
        ruleTypeLabel: { type: string }
        parametersJson:
          type: object
        executionOrder: { type: integer }
        isActive: { type: boolean }
        columnId: { type: string, format: uuid }
        columnName: { type: string }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }

    CleaningHistoryResponse:
      type: object
      properties:
        historyId: { type: string, format: uuid }
        datasetId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        executedAt: { type: string, format: date-time }
        executedAtFormatted: { type: string }
        status:
          $ref: '#/components/schemas/CleaningHistoryStatus'
        statusLabel: { type: string }
        details: { type: string }
        durationMs: { type: integer }
        durationFormatted: { type: string }
        affectedRows: { type: integer }
        datasetName: { type: string }
        datasetRowCount: { type: integer }
        ruleType:
          $ref: '#/components/schemas/RuleType'
        ruleTypeLabel: { type: string }
        columnName: { type: string }
        ruleParameters: { type: string }
        userFullName: { type: string }
        userEmail: { type: string }

    PredefinedAnalysisResponse:
      type: object
      properties:
        analysisId: { type: string, format: uuid }
        analysisName: { type: string }
        description: { type: string }
        category: { type: string }
        categoryLabel: { type: string }
        referenceScript: { type: string }
        requiredParametersJson:
          type: object
        executionCount: { type: integer, format: int64 }

    AnalysisExecutionResponse:
      type: object
      properties:
        executionId: { type: string, format: uuid }
        executedAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/AnalysisExecutionStatus'
        statusLabel: { type: string }
        durationMs: { type: integer }
        durationFormatted: { type: string }
        usedParametersJson: { type: string }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        analysisId: { type: string, format: uuid }
        analysisName: { type: string }
        analysisCategory:
          $ref: '#/components/schemas/AnalysisCategory'
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResultResponse'
        resultCount: { type: integer }

    AnalysisResultResponse:
      type: object
      properties:
        resultId: { type: string, format: uuid }
        resultType:
          $ref: '#/components/schemas/ResultType'
        resultTypeLabel: { type: string }
        title: { type: string }
        filePath: { type: string }
        fileFormat: { type: string }
        displayOrder: { type: integer }
        executionId: { type: string, format: uuid }
        chart:
          $ref: '#/components/schemas/ChartResponse'
        downloadUrl: { type: string }

    ChartResponse:
      type: object
      properties:
        chartId: { type: string, format: uuid }
        chartType:
          $ref: '#/components/schemas/ChartType'
        chartTypeLabel: { type: string }
        configJson:
          type: object
        resultId: { type: string, format: uuid }
        resultTitle: { type: string }
        resultType: { type: string }
        imageUrl: { type: string }

    ExportResponse:
      type: object
      properties:
        exportId: { type: string, format: uuid }
        exportFormat:
          $ref: '#/components/schemas/ExportFormat'
        formatLabel: { type: string }
        exportedAt: { type: string, format: date-time }
        filePath: { type: string }
        fileName: { type: string }
        fileSize: { type: integer, format: int64 }
        fileSizeFormatted: { type: string }
        executionId: { type: string, format: uuid }
        executionStatus:
          $ref: '#/components/schemas/AnalysisExecutionStatus'
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        downloadUrl: { type: string }

    UserResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        role:
          $ref: '#/components/schemas/UserRole'
        roleLabel: { type: string }
        roleDescription: { type: string }
        createdAt: { type: string, format: date-time }
        lastLogin: { type: string, format: date-time }
        category:
          $ref: '#/components/schemas/UserCategoryResponse'

    UserCategoryResponse:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        label: { type: string }
        description: { type: string }
        accessLevel: { type: integer }
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'

    PermissionResponse:
      type: object
      properties:
        permissionId: { type: string, format: uuid }
        code: { type: string }
        label: { type: string }
        module: { type: string }

    UserStatisticsResponse:
      type: object
      properties:
        totalUsers: { type: integer, format: int64 }
        activeUsers: { type: integer, format: int64 }
        inactiveUsers: { type: integer, format: int64 }
        totalCategories: { type: integer, format: int64 }
