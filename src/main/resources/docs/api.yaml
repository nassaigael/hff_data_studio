        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditLogResponse"

  /admin/audit/{logId}:
    get:
      tags: [Audit]
      summary: Get audit log by ID
      operationId: getAuditLogById
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"

  /admin/audit/actions:
    get:
      tags: [Audit]
      summary: Get distinct audit actions
      operationId: getActions
      responses:
        "200":
          description: List of actions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /admin/audit/summary:
    get:
      tags: [Audit]
      summary: Get audit summary
      operationId: getAuditSummary
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                type: object

  # ==================== HEALTH ====================
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object

  /health/info:
    get:
      tags: [Health]
      summary: Service info
      operationId: info
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ===== AUTH =====
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
          default: Bearer

    # ===== USERS =====
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
        category:
          $ref: "#/components/schemas/UserCategoryResponse"

    UserCreationRequest:
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        password:
          type: string
        categoryId:
          type: string
          format: uuid
      required: [lastName, firstName, email, password, categoryId]

    UserUpdateRequest:
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        categoryId:
          type: string
          format: uuid
        newPassword:
          type: string

    ChangePasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
      required: [newPassword]

    UserCategoryResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        accessLevel:
          type: integer
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionResponse"

    PermissionResponse:
      type: object
      properties:
        permissionId:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        module:
          type: string

    CategoryCreationRequest:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        accessLevel:
          type: integer
      required: [label, accessLevel]

    PermissionUpdateRequest:
      type: object
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid

    UserStatisticsResponse:
      type: object
      properties:
        totalUsers:
          type: integer
          format: int64
        activeUsers:
          type: integer
          format: int64
        inactiveUsers:
          type: integer
          format: int64
        totalCategories:
          type: integer
          format: int64
        newUsersLast30Days:
          type: integer
          format: int64
        newUsersLast7Days:
          type: integer
          format: int64
        activeUsersLast30Days:
          type: integer
          format: int64
        activeUsersLast7Days:
          type: integer
          format: int64
        activityRate:
          type: number
          format: double
        adminCount:
          type: integer
          format: int64
        analystCount:
          type: integer
          format: int64
        consultantCount:
          type: integer
          format: int64
        guestCount:
          type: integer
          format: int64
        activePercentage:
          type: number
          format: double

    # ===== PROJECTS =====
    ProjectStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ARCHIVED]

    ProjectResponse:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ProjectStatus"
        creatorUserId:
          type: string
          format: uuid
        creatorFullName:
          type: string
        fileCount:
          type: integer
          format: int64
        datasetCount:
          type: integer
          format: int64

    ProjectCreationRequest:
      type: object
      properties:
        projectName:
          type: string
        description:
          type: string
      required: [projectName]

    ProjectUpdateRequest:
      type: object
      properties:
        projectName:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectStatisticsResponse:
      type: object
      properties:
        totalProjects:
          type: integer
          format: int64
        inProgress:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        archived:
          type: integer
          format: int64
        totalCreators:
          type: integer
          format: int64
        newProjectsLast30Days:
          type: integer
          format: int64

    # ===== FILES =====
    FileType:
      type: string
      enum: [CSV, EXCEL, SQL]

    FileProcessingStatus:
      type: string
      enum: [RECEIVED, ANALYZING, EXPLORED, CLEANED, ERROR]

    SourceFileResponse:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        fileName:
          type: string
        fileType:
          $ref: "#/components/schemas/FileType"
        storagePath:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sizeFormatted:
          type: string
        uploadedAt:
          type: string
          format: date-time
        processingStatus:
          $ref: "#/components/schemas/FileProcessingStatus"
        statusLabel:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        userId:
          type: string
          format: uuid
        userFullName:
          type: string
        datasetCount:
          type: integer

    # ===== DATASETS =====
    DatasetResponse:
      type: object
      properties:
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string
        rowCount:
          type: integer
        columnCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        isCleaned:
          type: boolean
        fileId:
          type: string
          format: uuid
        fileName:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        qualityScore:
          type: integer
        analysisCount:
          type: integer

    DatasetColumnResponse:
      type: object
      properties:
        columnId:
          type: string
          format: uuid
        originalName:
          type: string
        normalizedName:
          type: string
        detectedType:
          $ref: "#/components/schemas/ColumnType"
        targetType:
          $ref: "#/components/schemas/ColumnType"
        position:
          type: integer
        nullCount:
          type: integer
        nullPercentage:
          type: number
        uniqueCount:
          type: integer
        uniquePercentage:
          type: number
        cleaningRuleCount:
          type: integer
        datasetId:
          type: string
          format: uuid

    ColumnType:
      type: string
      enum: [STRING, INTEGER, FLOAT, DATE, BOOLEAN]

    DatasetColumnUpdateRequest:
      type: object
      properties:
        normalizedName:
          type: string
        targetType:
          $ref: "#/components/schemas/ColumnType"

    DatasetStatisticsResponse:
      type: object
      properties:
        totalDatasets:
          type: integer
          format: int64
        cleanedDatasets:
          type: integer
          format: int64
        uncleanedDatasets:
          type: integer
          format: int64
        totalRows:
          type: integer
          format: int64
        totalColumns:
          type: integer
          format: int64
        averageRows:
          type: number
          format: double
        averageColumns:
          type: number
          format: double
        averageQualityScore:
          type: number
          format: double

    # ===== EXPLORATION =====
    ExplorationReportResponse:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        totalRows:
          type: integer
        duplicateCount:
          type: integer
        missingValuesCount:
          type: integer
        qualityScore:
          type: number
        reportPdfPath:
          type: string
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string
        columnStatistics:
          type: object

    # ===== CLEANING =====
    RuleType:
      type: string
      enum: [TYPE_CONVERSION, DUPLICATE_REMOVAL, NULL_IMPUTATION, REGEX_CLEANING, TRIM, VALUE_CONSTRAINT]

    CleaningRuleResponse:
      type: object
      properties:
        ruleId:
          type: string
          format: uuid
        ruleType:
          $ref: "#/components/schemas/RuleType"
        ruleTypeLabel:
          type: string
        parametersJson:
          type: object
        executionOrder:
          type: integer
        isActive:
          type: boolean
        columnId:
          type: string
          format: uuid
        columnName:
          type: string
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string

    CleaningRuleRequest:
      type: object
      properties:
        ruleType:
          $ref: "#/components/schemas/RuleType"
        parametersJson:
          type: object
        executionOrder:
          type: integer
        isActive:
          type: boolean
      required: [ruleType]

    CleaningHistoryStatus:
      type: string
      enum: [SUCCESS, FAILURE, PARTIAL_SUCCESS, IN_PROGRESS, CANCELLED, PENDING]

    CleaningHistoryResponse:
      type: object
      properties:
        historyId:
          type: string
          format: uuid
        executedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CleaningHistoryStatus"
        statusLabel:
          type: string
        statusIcon:
          type: string
        details:
          type: string
        durationMs:
          type: integer
        durationFormatted:
          type: string
        affectedRows:
          type: integer
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string
        ruleId:
          type: string
          format: uuid
        ruleType:
          $ref: "#/components/schemas/RuleType"
        ruleTypeLabel:
          type: string
        columnName:
          type: string
        userId:
          type: string
          format: uuid
        userFullName:
          type: string
        userEmail:
          type: string

    # ===== ANALYSES =====
    AnalysisCategory:
      type: string
      enum: [STATISTICAL, CORRELATION, TEMPORAL, SEGMENTATION, FINANCIAL]

    PredefinedAnalysisResponse:
      type: object
      properties:
        analysisId:
          type: string
          format: uuid
        analysisName:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/AnalysisCategory"
        categoryLabel:
          type: string
        referenceScript:
          type: string
        requiredParametersJson:
          type: object
        executionCount:
          type: integer
          format: int64

    PredefinedAnalysisRequest:
      type: object
      properties:
        analysisName:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/AnalysisCategory"
        referenceScript:
          type: string
        requiredParametersJson:
          type: object
      required: [analysisName, category, referenceScript]

    AnalysisExecutionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ERROR, CANCELLED, PENDING]

    AnalysisExecutionRequest:
      type: object
      properties:
        datasetId:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        parameters:
          type: object
      required: [datasetId]

    AnalysisExecutionResponse:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        executedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AnalysisExecutionStatus"
        statusLabel:
          type: string
        durationMs:
          type: integer
        durationFormatted:
          type: string
        usedParametersJson:
          type: object
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string
        analysisId:
          type: string
          format: uuid
        analysisName:
          type: string
        analysisCategory:
          $ref: "#/components/schemas/AnalysisCategory"
        userId:
          type: string
          format: uuid
        userFullName:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisResultResponse"
        resultCount:
          type: integer

    ResultType:
      type: string
      enum: [TABLE, CHART, KPI]

    ChartType:
      type: string
      enum: [BAR, LINE, PIE, SCATTER, AREA]

    ChartResponse:
      type: object
      properties:
        chartId:
          type: string
          format: uuid
        chartType:
          $ref: "#/components/schemas/ChartType"
        chartTypeLabel:
          type: string
        configJson:
          type: object
        resultId:
          type: string
          format: uuid

    AnalysisResultResponse:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        resultType:
          $ref: "#/components/schemas/ResultType"
        resultTypeLabel:
          type: string
        title:
          type: string
        filePath:
          type: string
        fileFormat:
          type: string
        displayOrder:
          type: integer
        executionId:
          type: string
          format: uuid
        chart:
          $ref: "#/components/schemas/ChartResponse"
        downloadUrl:
          type: string

    # ===== EXPORTS =====
    ExportFormat:
      type: string
      enum: [CSV, XLSX, PNG, ZIP]

    ExportRequest:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        resultIds:
          type: array
          items:
            type: string
            format: uuid
      required: [executionId, exportFormat]

    ExportResponse:
      type: object
      properties:
        exportId:
          type: string
          format: uuid
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        formatLabel:
          type: string
        exportedAt:
          type: string
          format: date-time
        filePath:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        fileSizeFormatted:
          type: string
        executionId:
          type: string
          format: uuid
        executionStatus:
          type: string
        userId:
          type: string
          format: uuid
        userFullName:
          type: string
        downloadUrl:
          type: string

    # ===== AUDIT =====
    AuditLogResponse:
      type: object
      properties:
        logId:
          type: string
          format: uuid
        action:
          type: string
        concernedEntity:
          type: string
        entityId:
          type: string
          format: uuid
        actionDate:
          type: string
          format: date-time
        ipAddress:
          type: string
        userId:
          type: string
          format: uuid
        userFullName:
          type: string
        userEmail:
          type: string

    # ===== PAGINATION =====
    PageResponse:
      type: object
      properties:
        content:
          type: array
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        isFirst:
          type: boolean
        isLast:
          type: boolean
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    PageUserResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/UserResponse"

    PageProjectResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/ProjectResponse"

    PageSourceFileResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/SourceFileResponse"

    PageDatasetResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/DatasetResponse"

    PageCleaningHistoryResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/CleaningHistoryResponse"

    PageAnalysisExecutionResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisExecutionResponse"

    PageExportResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/ExportResponse"

    PageAuditLogResponse:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/AuditLogResponse"

security:
  - bearerAuth: []