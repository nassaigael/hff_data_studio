openapi: 3.0.3
info:
  title: HFF Data Studio API
  description: |
    HFF Data Intelligence Platform - From raw data to decision, without detour.
    
    API complète pour la gestion de projets, fichiers, datasets, nettoyage,
    analyse, exploration et export de données.
  version: 1.0.0
  contact:
    name: Henri Fraise
    email: contact@hff.re
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://catalyst.hff.re/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Endpoints d'authentification (login, refresh, logout)
  - name: Health
    description: Vérification de l'état du service
  - name: Projects
    description: Gestion des projets
  - name: Files
    description: Upload et gestion des fichiers sources
  - name: Datasets
    description: Gestion des datasets et colonnes
  - name: Exploration
    description: Rapports d'exploration et qualité des données
  - name: Cleaning
    description: Règles et exécution du nettoyage
  - name: Analysis
    description: Analyses prédéfinies et exécutions
  - name: Executions
    description: Exécutions d'analyses
  - name: Exports
    description: Export des résultats
  - name: Users
    description: Gestion des utilisateurs (admin)
  - name: Categories
    description: Gestion des catégories et permissions (admin)
  - name: Audit
    description: Logs d'audit (admin)

security:
  - bearerAuth: []

paths:
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Authentication]
      summary: Connexion utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rafraîchir le token d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Déconnexion
      responses:
        '204':
          description: Déconnexion réussie

  # ==================== HEALTH ====================
  /health:
    get:
      tags: [Health]
      summary: État du service
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string }
                  version: { type: string }
                  timestamp: { type: integer, format: int64 }

  /health/info:
    get:
      tags: [Health]
      summary: Informations du service
      security: []
      responses:
        '200':
          description: Informations
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  description: { type: string }

  # ==================== PROJECTS ====================
  /projects:
    get:
      tags: [Projects]
      summary: Liste des projets de l'utilisateur connecté
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Liste paginée des projets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'
    post:
      tags: [Projects]
      summary: Créer un projet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreationRequest'
      responses:
        '201':
          description: Projet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/all:
    get:
      tags: [Projects]
      summary: Liste tous les projets (admin)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Détails d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Mettre à jour un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Projet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    delete:
      tags: [Projects]
      summary: Archiver un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204':
          description: Projet archivé

  /projects/{projectId}/restore:
    patch:
      tags: [Projects]
      summary: Restaurer un projet archivé
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Projet restauré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/{projectId}/status:
    patch:
      tags: [Projects]
      summary: Modifier le statut d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /projects/search:
    get:
      tags: [Projects]
      summary: Rechercher des projets
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseProjectResponse'

  /projects/statistics:
    get:
      tags: [Projects]
      summary: Statistiques globales des projets (admin)
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatisticsResponse'

  # ==================== FILES ====================
  /files/upload:
    post:
      tags: [Files]
      summary: Uploader un fichier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, projectId]
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
                  format: uuid
                fileType:
                  type: string
      responses:
        '201':
          description: Fichier uploadé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileResponse'

  /files/{fileId}:
    get:
      tags: [Files]
      summary: Détails d'un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Fichier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileResponse'
    delete:
      tags: [Files]
      summary: Supprimer un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '204':
          description: Fichier supprimé

  /files/{fileId}/download:
    get:
      tags: [Files]
      summary: Télécharger un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Contenu binaire du fichier
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/project/{projectId}:
    get:
      tags: [Files]
      summary: Liste des fichiers d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Liste des fichiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceFileResponse'

  /files/project/{projectId}/page:
    get:
      tags: [Files]
      summary: Liste paginée des fichiers d'un projet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseSourceFileResponse'

  /files/{fileId}/datasets:
    get:
      tags: [Files]
      summary: Datasets associés à un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
      responses:
        '200':
          description: Liste des datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetResponse'

  /files/{fileId}/preview:
    get:
      tags: [Files]
      summary: Aperçu du contenu d'un fichier
      parameters:
        - $ref: '#/components/parameters/FileIdPath'
        - name: maxLines
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Aperçu
          content:
            text/plain:
              schema: { type: string }

  /files/all:
    get:
      tags: [Files]
      summary: Liste tous les fichiers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseSourceFileResponse'

  # ==================== DATASETS ====================
  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      summary: Détails d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
    delete:
      tags: [Datasets]
      summary: Supprimer un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '204':
          description: Dataset supprimé

  /datasets/{datasetId}/data:
    get:
      tags: [Datasets]
      summary: Récupérer les données d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string, default: CLEANED }
      responses:
        '200':
          description: Données du dataset
          content:
            application/json:
              schema:
                type: object

  /datasets/{datasetId}/columns:
    get:
      tags: [Datasets]
      summary: Liste des colonnes d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Colonnes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetColumnResponse'

  /datasets/{datasetId}/columns/{columnId}:
    get:
      tags: [Datasets]
      summary: Détails d'une colonne
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/ColumnIdPath'
      responses:
        '200':
          description: Colonne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnResponse'
    put:
      tags: [Datasets]
      summary: Mettre à jour une colonne
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/ColumnIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetColumnUpdateRequest'
      responses:
        '200':
          description: Colonne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnResponse'

  /datasets/statistics:
    get:
      tags: [Datasets]
      summary: Statistiques globales des datasets
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetStatisticsResponse'

  /datasets/search:
    get:
      tags: [Datasets]
      summary: Rechercher des datasets
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDatasetResponse'

  /datasets/recent:
    get:
      tags: [Datasets]
      summary: Datasets récents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetResponse'

  # ==================== EXPLORATION ====================
  /datasets/{datasetId}/exploration/report:
    get:
      tags: [Exploration]
      summary: Récupérer le rapport d'exploration
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Rapport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationReportResponse'
    post:
      tags: [Exploration]
      summary: Générer un rapport d'exploration
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '201':
          description: Rapport généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationReportResponse'

  /datasets/{datasetId}/exploration/report/export:
    get:
      tags: [Exploration]
      summary: Exporter le rapport
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - name: format
          in: query
          schema: { type: string, default: PDF, enum: [PDF, HTML] }
      responses:
        '200':
          description: Fichier exporté
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /datasets/{datasetId}/exploration/summary:
    get:
      tags: [Exploration]
      summary: Résumé de l'exploration
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Résumé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationReportResponse'

  # ==================== CLEANING ====================
  /columns/{columnId}/rules:
    get:
      tags: [Cleaning]
      summary: Règles de nettoyage d'une colonne
      parameters:
        - $ref: '#/components/parameters/ColumnIdPath'
      responses:
        '200':
          description: Liste des règles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CleaningRuleResponse'
    post:
      tags: [Cleaning]
      summary: Créer une règle de nettoyage
      parameters:
        - $ref: '#/components/parameters/ColumnIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleaningRuleRequest'
      responses:
        '201':
          description: Règle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningRuleResponse'

  /rules/{ruleId}:
    put:
      tags: [Cleaning]
      summary: Mettre à jour une règle
      parameters:
        - $ref: '#/components/parameters/RuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleaningRuleRequest'
      responses:
        '200':
          description: Règle mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningRuleResponse'
    delete:
      tags: [Cleaning]
      summary: Supprimer une règle
      parameters:
        - $ref: '#/components/parameters/RuleIdPath'
      responses:
        '204':
          description: Règle supprimée

  /datasets/{datasetId}/cleaning/execute:
    post:
      tags: [Cleaning]
      summary: Exécuter le nettoyage d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '202':
          description: Nettoyage lancé
          content:
            application/json:
              schema:
                type: object

  /datasets/{datasetId}/cleaning-history:
    get:
      tags: [Cleaning]
      summary: Historique de nettoyage d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Historique paginé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseCleaningHistoryResponse'

  /cleaning-history/{historyId}:
    get:
      tags: [Cleaning]
      summary: Détails d'une opération de nettoyage
      parameters:
        - $ref: '#/components/parameters/HistoryIdPath'
      responses:
        '200':
          description: Détails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningHistoryResponse'

  /datasets/{datasetId}/cleaning/status:
    get:
      tags: [Cleaning]
      summary: Statut du nettoyage d'un dataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: Statut
          content:
            application/json:
              schema:
                type: object

  # ==================== ANALYSIS ====================
  /analyses:
    get:
      tags: [Analysis]
      summary: Liste des analyses prédéfinies
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/AnalysisCategory'
      responses:
        '200':
          description: Liste des analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PredefinedAnalysisResponse'
    post:
      tags: [Analysis]
      summary: Créer une analyse prédéfinie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredefinedAnalysisRequest'
      responses:
        '201':
          description: Analyse créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedAnalysisResponse'

  /analyses/{analysisId}:
    get:
      tags: [Analysis]
      summary: Détails d'une analyse
      parameters:
        - $ref: '#/components/parameters/AnalysisIdPath'
      responses:
        '200':
          description: Analyse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedAnalysisResponse'
    put:
      tags: [Analysis]
      summary: Mettre à jour une analyse
      parameters:
        - $ref: '#/components/parameters/AnalysisIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredefinedAnalysisRequest'
      responses:
        '200':
          description: Analyse mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedAnalysisResponse'
    delete:
      tags: [Analysis]
      summary: Supprimer une analyse
      parameters:
        - $ref: '#/components/parameters/AnalysisIdPath'
      responses:
        '204':
          description: Analyse supprimée

  /analyses/categories:
    get:
      tags: [Analysis]
      summary: Liste des catégories d'analyse
      responses:
        '200':
          description: Catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisCategory'

  /analyses/models:
    post:
      tags: [Analysis]
      summary: Sauvegarder un modèle d'analyse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Modèle sauvegardé
          content:
            application/json:
              schema:
                type: object

  # ==================== EXECUTIONS ====================
  /executions:
    post:
      tags: [Executions]
      summary: Lancer une analyse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisExecutionRequest'
      responses:
        '202':
          description: Analyse lancée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisExecutionResponse'
    get:
      tags: [Executions]
      summary: Liste des exécutions
      parameters:
        - name: datasetId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAnalysisExecutionResponse'

  /executions/{executionId}:
    get:
      tags: [Executions]
      summary: Détails d'une exécution
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '200':
          description: Exécution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisExecutionResponse'

  /executions/{executionId}/results:
    get:
      tags: [Executions]
      summary: Résultats d'une exécution
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisResultResponse'

  /executions/{executionId}/cancel:
    patch:
      tags: [Executions]
      summary: Annuler une exécution
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '204':
          description: Exécution annulée

  /results/{resultId}/download:
    get:
      tags: [Executions]
      summary: Télécharger un résultat
      parameters:
        - $ref: '#/components/parameters/ResultIdPath'
      responses:
        '200':
          description: Fichier binaire
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ==================== EXPORTS ====================
  /exports:
    post:
      tags: [Exports]
      summary: Créer un export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '201':
          description: Export créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
    get:
      tags: [Exports]
      summary: Liste des exports
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/ExportFormat'
      responses:
        '200':
          description: Liste paginée
          content:
